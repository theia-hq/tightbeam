# Builds checksummed linux + macOS binaries and attaches them to a GitHub Release on a `v*` tag.
# tightbeam depends on its theia siblings (bifrost, nauthy, sshh, ...) by git URL, so cargo fetches
# them during the build: no sibling checkouts needed. Built with `--features ssh` so the released
# binary can `expose ssh=sshd:` out of the box.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # mint the OIDC token the attestation is signed with (keyless, no key to manage)
  attestations: write  # record the signed build-provenance attestation for each binary

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tightbeam-x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: tightbeam-aarch64-linux
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: tightbeam-aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release -p tightbeam --features ssh --target ${{ matrix.target }}
      - name: package + checksum
        run: |
          cp "target/${{ matrix.target }}/release/tightbeam" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
      - name: attest build provenance
        # Keyless (sigstore/OIDC, no key to manage): records a signed provenance attestation binding this
        # binary to the workflow that built it. Verify with `gh attestation verify <bin> --repo theia-hq/tightbeam`.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
