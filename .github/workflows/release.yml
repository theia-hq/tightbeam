# Builds checksummed linux + macOS binaries and attaches them to a GitHub Release on a `v*` tag.
# tightbeam path-deps bifrost + nauthy, so the release build checks them out as siblings under the
# workspace (matching the local layout) before building.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tightbeam-x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: tightbeam-aarch64-linux
          - runner: macos-13
            target: x86_64-apple-darwin
            asset: tightbeam-x86_64-macos
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: tightbeam-aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tightbeam
      - uses: actions/checkout@v4
        with:
          repository: theia-hq/bifrost
          path: bifrost
      - uses: actions/checkout@v4
        with:
          repository: theia-hq/nauthy
          path: nauthy
      - uses: actions/checkout@v4
        with:
          repository: theia-hq/quirk
          path: quirk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        working-directory: tightbeam
        run: cargo build --release -p tightbeam --target ${{ matrix.target }}
      - name: package + checksum
        run: |
          cp "tightbeam/target/${{ matrix.target }}/release/tightbeam" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
