# Builds checksummed linux + macOS binaries and attaches them to a GitHub Release on a `v*` tag.
# tightbeam pins its theia siblings (bifrost, nauthy) by exact git rev (see tightbeam/Cargo.toml), so a
# tag reproduces the pinned dep graph; cargo fetches them at build time, no sibling checkout needed.
# NOT --locked (decision (A), notes/02-DECISIONS.md): reproducibility comes from the Cargo.toml rev pins,
# not from enforcing the committed lock. The build is plain: tightbeam defines no `ssh` feature (ssh lives
# in swoosh's crate), so nothing extra is enabled here.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # mint the OIDC token the attestation is signed with (keyless, no key to manage)
  attestations: write  # record the signed build-provenance attestation for each binary

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tightbeam-x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: tightbeam-aarch64-linux
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: tightbeam-aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release -p tightbeam --target ${{ matrix.target }}
      - name: package + checksum
        run: |
          cp "target/${{ matrix.target }}/release/tightbeam" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
      - name: attest build provenance
        # Keyless (sigstore/OIDC, no key to manage): records a signed provenance attestation binding this
        # binary to the workflow that built it. Verify with `gh attestation verify <bin> --repo theia-hq/tightbeam`.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset }}
      - name: extract release notes
        # Fill the GH release body from the matching CHANGELOG section. Fails if the section is missing,
        # which also enforces the reconcile-CHANGELOG-before-tag rule.
        run: |
          v="${GITHUB_REF_NAME}"
          awk -v h="## $v" '
            $0 ~ "^"h"([[:space:]]|$)" {p=1; next}
            p && /^## / {exit}
            p {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "no CHANGELOG section for $v"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
