# cargo-deny sources allow-list (Track C, release-robustness-spec.md §2).
#
# The hand-rolled scripts/lock-guard.sh owns path-drift, sibling rev, and own-version skew. This
# owns the complementary SUPPLY-CHAIN question it does not: no crate may resolve from an
# unexpected git host or registry (a typosquat, a hijacked mirror, an accidental `git = "a-fork"`).
# Only our own siblings (github.com/theia-hq) and crates.io are allowed by source, plus one pinned
# upstream: n0-computer/noq, for the noq-proto patch in Cargo.toml that takes the unreleased fix for
# RUSTSEC-2026-0185. Pinned by full hash there; drop the entry with that patch the day n0 releases it.
#
# Scope is deliberately `sources` ONLY for Track C. advisories/bans/licenses are valuable but a
# separate policy; do not scope-creep this into a full supply-chain gate. Run: cargo deny check sources
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = ["https://github.com/n0-computer/noq"]

# Allow the whole theia-hq GitHub ORG (every sibling: bifrost, nauthy, ...), which is exactly the
# ratified trust boundary stated above. A bare `allow-git = ["https://github.com/theia-hq"]` does NOT
# express this: cargo-deny's `allow-git` matches a FULL repository URL, so an org-only prefix matches no
# source at all (each sibling resolves from `github.com/theia-hq/<repo>`, and cargo-deny warns
# `unmatched-source`). `allow-org.github` is the org-level match cargo-deny provides for precisely this
# "our whole org is trusted" case; the trust surface is the theia-hq org, crates.io, and the one noq pin.
[sources.allow-org]
github = ["theia-hq"]
