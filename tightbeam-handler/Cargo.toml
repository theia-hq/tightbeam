[package]
publish = false  # git-only for now, not published to crates.io
name = "tightbeam-handler"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "The handler contract a tightbeam service implements: exposure, metering, and the served proof."
repository = "https://github.com/theia-hq/tightbeam"

[dependencies]
# The gate's single-use admission witness and the origin it carries. `default-features = false` keeps the
# contract runtime-free (no file denylist, no OS RNG); a consumer that needs those unifies its own nauthy
# features in, cargo features being additive.
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "a7c82bf58db5d54795b4a3c544da8ca7d2e0a81c", default-features = false }
# `Refusal` for the typed serve error. `bifrost-core` only: the contract never names a transport backend.
bifrost-core = { git = "https://github.com/theia-hq/bifrost", rev = "3d1f79e84c7d8480896ef2d83120867de53a3726" }
thiserror = "2"
# The boxed stream halves a handler receives. `io-util` only, no runtime: the contract never spawns.
tokio = { version = "1", default-features = false, features = ["io-util"] }

[dev-dependencies]
# The proof tests build a real rooted gate over the file-backed denylist, the same mint a dispatcher uses, so
# they need nauthy's `fs` feature; the contract's normal dependency stays free of file access.
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "a7c82bf58db5d54795b4a3c544da8ca7d2e0a81c", features = ["fs"] }

[lints]
workspace = true
