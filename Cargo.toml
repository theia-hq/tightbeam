[package]
name = "tightbeam"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
# theia
# Pinned to a rev for reproducible releases: a tag builds the exact sibling commits, not floating HEAD.
# The root .cargo/config.toml [patch] overrides these with local paths for dev, so rev is dev-irrelevant.
# Bump on release: `cargo update -p <crate>` (or edit the rev) to advance deliberately.
bifrost = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }
bifrost-iroh = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }
bifrost-mdns = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "1c1a15b43789a50925d06361d7a8a4cc856abedd" }
sshh = { git = "https://github.com/theia-hq/sshh", rev = "e1f6e0eff68568686a1ffa2b5b2a40f910c646fc", optional = true }

blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[features]
# `ssh` bundles the `sshh` keyless-ssh service as an `expose ssh=sshd:` target. Off by default so the
# tunnel stays lean: russh/ssh-key/pty-process live in `sshh` and are only pulled in with this feature.
ssh = ["dep:sshh"]

[dev-dependencies]
bifrost-mem = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[lints.rust]
unused_must_use = "deny"

# Ship a lean release binary: strip symbols, whole-program LTO, single codegen unit. Halves the artifact
# (~26MB -> ~13-15MB) at no runtime cost: only a longer release link, which is a CI concern, not a user's.
[profile.release]
strip = true
lto = true
codegen-units = 1
