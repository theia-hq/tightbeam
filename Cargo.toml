[package]
name = "tightbeam"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
# theia. Sibling git-deps are pinned to an EXACT rev so a tightbeam release records exactly which
# nauthy/bifrost commit compiled in, instead of floating on default-branch HEAD. The local dev
# `.cargo/config.toml` still [patch]es these by URL to sibling PATH checkouts, so a `rev` here does not
# slow local builds (the patch wins locally regardless of the rev); CI resolves the rev from GitHub. All
# bifrost-* crates live in one repo, so they share one rev. Bump deliberately each release.
bifrost = { git = "https://github.com/theia-hq/bifrost", rev = "26e8272d890b0b424bc6960b9d38e09b40cc428d" }
bifrost-iroh = { git = "https://github.com/theia-hq/bifrost", rev = "26e8272d890b0b424bc6960b9d38e09b40cc428d" }
bifrost-mdns = { git = "https://github.com/theia-hq/bifrost", rev = "26e8272d890b0b424bc6960b9d38e09b40cc428d" }
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "d00f41366201f583c8e7a7431b15254719de1f93" }

clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# The raw-stream forward (`file:`/`fifo:`) opens an existing OS object with O_NOFOLLOW and stats it to
# refuse anything that is not a regular file or a FIFO. Those two guards need the libc open flags and the
# `st_mode` type macros, which std does not surface; unix-only, matching where `fifo:`/`unix:` live.
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
bifrost-mem = { git = "https://github.com/theia-hq/bifrost", rev = "26e8272d890b0b424bc6960b9d38e09b40cc428d" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[lints.rust]
unused_must_use = "deny"

# Ship a lean release binary: strip symbols, whole-program LTO, single codegen unit. Halves the artifact
# (~26MB -> ~13-15MB) at no runtime cost: only a longer release link, which is a CI concern, not a user's.
[profile.release]
strip = true
lto = true
codegen-units = 1
