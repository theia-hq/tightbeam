[workspace]
# One repo, two crates: the tunnel library and the lean handler contract it dispatches. A workspace makes
# `tightbeam-handler` resolvable as a git dependency of its own (a consumer pins the contract without taking
# the tunnel's heavy tree); the contract's manifest is `tightbeam-handler/Cargo.toml`.
members = ["tightbeam-handler"]
resolver = "3"

[package]
publish = false  # git-only for now, not published to crates.io
name = "tightbeam"
description = "Named services behind one gate, reached by public key: a router, a connector, and the wire between them."
version = "0.15.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
# Siblings. Sibling git-deps are pinned to an EXACT rev so a tightbeam release records exactly which
# nauthy/bifrost commit compiled in, instead of floating on default-branch HEAD. The local dev
# `.cargo/config.toml` still [patch]es these by URL to sibling PATH checkouts, so a `rev` here does not
# slow local builds (the patch wins locally regardless of the rev); CI resolves the rev from GitHub. All
# bifrost-* crates live in one repo, so they share one rev. Bump deliberately each release.
bifrost = { git = "https://github.com/theia-hq/bifrost", rev = "ed7cd8d591b4bef3ff1d005ad4f8b9b6a82b8359" }
bifrost-iroh = { git = "https://github.com/theia-hq/bifrost", rev = "ed7cd8d591b4bef3ff1d005ad4f8b9b6a82b8359" }
bifrost-mdns = { git = "https://github.com/theia-hq/bifrost", rev = "ed7cd8d591b4bef3ff1d005ad4f8b9b6a82b8359" }
# The key file store, in bifrost's repo beside the identity it stores. v0.7.0: a key file starts with
# `KEYSTORE`, and key text starts with `ed01`.
keystore = { git = "https://github.com/theia-hq/bifrost", rev = "ed7cd8d591b4bef3ff1d005ad4f8b9b6a82b8359" }
# v0.9.0: a link is `<key>.<token>` with no scheme, and key text starts with `ed01`.
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "2b2a8a94cd3ee211efb94aa0173f6009b5d1ba4f" }
# The handler contract, in-tree beside its only dispatcher. A path dep (not a git self-dep): the workspace
# member resolves within this checkout, and the package stays separately pinnable by a consumer.
tightbeam-handler = { path = "tightbeam-handler" }

clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# The raw-stream forward (`file:`/`fifo:`) opens an existing OS object with O_NOFOLLOW and stats it to
# refuse anything that is not a regular file or a FIFO. Those two guards need the libc open flags and the
# `st_mode` type macros, which std does not surface; unix-only, matching where `fifo:`/`unix:` live.
libc = "0.2"

[dev-dependencies]
# `start_paused` for the first-traffic deadline tests. Declared rather than inherited: it resolves
# today only through feature unification via iroh, so a dependency bump could drop it and break the
# test build. Every sibling repo using the paused clock declares it explicitly.
tokio = { version = "1", features = ["test-util"] }
bifrost-mem = { git = "https://github.com/theia-hq/bifrost", rev = "ed7cd8d591b4bef3ff1d005ad4f8b9b6a82b8359" }
# A hostile holder appends raw datalog to a cap it was given; nauthy's API writes only its own shapes, so
# the live cut's fail-closed read is tested with a token built the way that holder builds one. Both are
# already in the tree through nauthy.
biscuit-auth = "6"
data-encoding = "2"

[lints]
workspace = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[workspace.lints.rust]
unused_must_use = "deny"

# Ship a lean release binary: strip symbols, whole-program LTO, single codegen unit. Halves the artifact
# (~26MB -> ~13-15MB) at no runtime cost: only a longer release link, which is a CI concern, not a user's.
[profile.release]
strip = true
lto = true
codegen-units = 1
